[project]
name = "illuminate"
version = "0.1.0"
description = "Illuminate: surfaces fresh Product Manager openings from LinkedIn, newest first."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8.0",
    "beautifulsoup4>=4.12",
    "curl_cffi>=0.7",
    "fastapi>=0.110",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "uvicorn>=0.29",
]

[project.scripts]
illuminate = "illuminate.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
